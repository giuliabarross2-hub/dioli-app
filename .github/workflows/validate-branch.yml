name: Validar agenda sem publicar

on:
  push:
    branches:
      - proteger-edicao-agenda

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable

      - run: flutter pub get

      - run: flutter build web --release --base-href "/dioli-app/" --dart-define=DIOLI_API_KEY=${{ secrets.DIOLI_API_KEY }}
